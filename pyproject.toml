[project]
name = "credit-risk-scoring"
version = "0.1.0"
description = "Cross-validated, cost-aware credit-default scoring pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "kaggle>=1.6",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "scipy>=1.13",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    # pytest's terminalwriter unconditionally does `from pygments.lexer
    # import Lexer`; pygments>=2.21 removed that top-level module (only
    # `pygments.lexers` survives), breaking pytest startup entirely.
    # Pin below the break until pytest adapts.
    "pygments<2.21",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]
